<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VTM Admin Portal</title>
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="apple-touch-icon" href="../logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .status-select {
      padding: 0.35rem 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      min-width: 130px;
      cursor: pointer;
    }
    .status-select:focus { border-color: var(--vtm); }
    .status-select.billable { border-color: rgba(16,185,129,0.5); color: #34d399; }
    .status-select.nonbillable { border-color: rgba(239,68,68,0.5); color: #f87171; }
    .status-select.rejected { border-color: rgba(245,158,11,0.5); color: #fbbf24; }
    .status-select.pending { border-color: rgba(156,163,175,0.5); color: #9ca3af; }
    .badge-rejected {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }
    .badge-pending {
      background: rgba(156, 163, 175, 0.15);
      color: #9ca3af;
    }
    .admin-tag {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--vtm);
      font-weight: 600;
      margin-left: 0.35rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="admin.js"></script>
</body>
</html>
